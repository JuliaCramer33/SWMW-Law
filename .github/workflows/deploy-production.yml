name: Deploy to WP Engine (Production)

on:
  push:
    branches:
      - main # Deploys when commits are pushed to the main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            plugins/core-block-custom-breakpoints/package-lock.json
            themes/swmw-law/package-lock.json

      - name: Install libvips (sharp dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Build plugin assets
        working-directory: ./plugins/core-block-custom-breakpoints
        run: |
          npm ci
          npm run build

      - name: Build theme assets
        working-directory: ./themes/swmw-law
        run: |
          npm ci
          npm run build

      - name: Deploy to WP Engine Production
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: "swmwlawnew"
          REMOTE_PATH: "wp-content/"
          FLAGS: '-azvr --inplace --delete --exclude-from=.deployignore'
