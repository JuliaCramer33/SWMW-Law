# Deploys to WP Engine production when pushing to main.
# Update wpe_env below to your WP Engine production install name.

name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      wpe_env: swmwlawnew  # ← WP Engine production install name
    secrets: inherit
