# Deploys to WP Engine staging when pushing to develop.
# Update wpe_env below to your WP Engine staging install name.

name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      wpe_env: swmwlawstg  # ← WP Engine staging install name
    secrets: inherit
